name: BrevApp
options:
  bundleIdPrefix: com.brevapp
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "15.4"

settings:
  SWIFT_VERSION: "5.10"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""  # Set your Apple Developer Team ID here
  CODE_SIGN_STYLE: Automatic

targets:
  BrevApp:
    type: application
    platform: iOS
    sources:
      - path: BrevApp
        excludes:
          - "**/*.md"
    info:
      path: BrevApp/Info.plist
      properties:
        CFBundleDisplayName: BrevApp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSFaceIDUsageDescription: "BrevApp utilise Face ID pour sécuriser votre connexion."
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.brevapp.app
      INFOPLIST_FILE: BrevApp/Info.plist
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []
    scheme:
      testTargets:
        - BrevAppTests
      gatherCoverageData: true

  BrevAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BrevAppTests
    dependencies:
      - target: BrevApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.brevapp.tests
